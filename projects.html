      { title: 'Stackable Battery Holder', cat: 'robotics', img: 'https://user-cdn.hackclub-assets.com/019fcd26-2803-78ce-a613-62f09a019223/14.png', alt: 'Photo of the stackable battery holder print', link: 'https://makerworld.com/en/models/3117060-best-stackable-battery-holder-fast-and-useful' },

      { title: 'VEX IQ Robotics', cat: 'robotics', img: 'https://cdn.hackclub.com/019fcd29-e14d-73f8-9b8b-419509e6aeb2/maxresdefault.jpg', alt: 'VEX IQ Robotics Competition Mix and Match', link: 'https://events.vex.com/teams/VIQRC/23761A' },

      { title: 'Slack Bot', cat: 'web', img: 'https://stardance.hackclub.com/rails/active_storage/blobs/proxy/eyJfcmFpbHMiOnsiZGF0YSI6MTg0ODI3LCJwdXIiOiJibG9iX2lkIn19--74bb7a4361d0a49343070eb7a9eaac30043ed733/Screenshot%202026-07-21%20103728.png', alt: 'Slack bot project screenshot from the project page', link: 'https://github.com/chahatesh/Slack-bot' },
      { title: 'Rocket Flight Controller', cat: 'robotics', img: null, alt: 'No flight controller photo posted yet', link: 'https://github.com/chahatesh/Rocket-Flight-Controller' },
      { title: 'Remote Shutter', cat: 'robotics', img: null, alt: 'No finished Remote Shutter build photo posted', link: 'https://github.com/chahatesh/Remote-Shutter' }
    ];

    const grid = document.getElementById('archive-grid');

    function render(filter) {
      grid.innerHTML = projects
        .filter(p => filter === 'all' || p.cat === filter)
        .map(p => `
          <article class="archive-card" data-cat="${p.cat}">
            <div class="archive-thumb${p.img ? '' : ' image-missing'}">
              ${p.img ? `<img src="${p.img}" alt="${p.alt || p.title}" loading="lazy" decoding="async" onerror="this.onerror=null;this.hidden=true;this.parentElement.classList.add('image-missing');" />` : ''}
              <span class="archive-image-missing" aria-hidden="true">${p.img ? 'Image unavailable' : 'No photo posted yet'}</span>
            </div>
            <div class="archive-body">
              <h3>${p.title}</h3>
              ${p.link ? `<a href="${p.link}" target="_blank" rel="noopener" class="archive-link">View →</a>` : '<span class="archive-link disabled">No link yet</span>'}
            </div>
          </article>
        `).join('');
    }

    render('all');

    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => {
          b.classList.remove('active');
          b.setAttribute('aria-pressed', 'false');
        });
        btn.classList.add('active');
        btn.setAttribute('aria-pressed', 'true');
        render(btn.dataset.filter);
      });
    });

    document.getElementById('year2').textContent = new Date().getFullYear();

    const menuToggle = document.querySelector('.menu-toggle');
    const mobileNav = document.querySelector('.mobile-nav');
    const setMenuState = open => {
      mobileNav.classList.toggle('open', open);
      menuToggle.textContent = open ? 'close' : 'menu';
      menuToggle.setAttribute('aria-expanded', String(open));
      menuToggle.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
    };
    menuToggle.addEventListener('click', () => {
      setMenuState(!mobileNav.classList.contains('open'));
    });
    document.querySelectorAll('.mobile-nav a').forEach(a => a.addEventListener('click', () => {
      setMenuState(false);
    }));
  </script>
